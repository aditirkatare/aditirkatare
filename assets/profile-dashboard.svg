
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360">
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#080e1c"/>
      <stop offset="1" stop-color="#15102a"/>
    </linearGradient>
    <style>
      text { font-family: monospace; }
      .cyan { fill: #4deaff; }
      .purple { fill: #c4a1ff; }
      .muted { fill: #8294ba; }
      .line { stroke: #273957; }
      .pulse { animation: pulse 1.8s ease-in-out infinite; }
      .scan { animation: scan 4s linear infinite; }
      .cursor { animation: blink 1s steps(2) infinite; }
      @keyframes pulse { 50% { opacity: .35; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes scan {
        from { transform: translateY(0); }
        to { transform: translateY(210px); }
      }
    </style>
  </defs>

  <rect x="2" y="2" width="996" height="356" rx="14" fill="url(#bg)" stroke="#6554a5"/>
