  <text x="188" y="218" text-anchor="middle" class="muted" font-size="11">SCAN // ANALYZE</text>
  <text x="188" y="238" text-anchor="middle" class="muted" font-size="11">INVESTIGATE // VALIDATE</text>
  <rect x="29" y="102" width="318" height="3" fill="#4deaff" opacity=".55" class="scan"/>

  <rect x="374" y="58" width="608" height="282" rx="8" fill="#0c1528" stroke="#273957"/>
  <text x="392" y="82" class="cyan" font-size="14" font-weight="bold">SYSTEM.INFO</text>
